name: Verify SureAuto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sureauto_test
          POSTGRES_USER: sureauto
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sureauto -d sureauto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://sureauto:local-ci-only@localhost:5432/sureauto_test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Validate production Compose configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-64-character-example-0000000000000000
          SUREAUTO_PORT: 8080
          PUBLIC_REGISTRATION_ENABLED: "false"
      - name: Build production containers
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-64-character-example-0000000000000000
          SUREAUTO_PORT: 8080
          PUBLIC_REGISTRATION_ENABLED: "false"
