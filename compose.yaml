services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sureauto
      POSTGRES_USER: sureauto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - sureauto-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sureauto -d sureauto"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      NODE_ENV: production
      SANDBOX_MODE: "false"
      DATABASE_URL: "postgresql://sureauto:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the ignored .env file}@db:5432/sureauto"
      API_PORT: "3001"
      COOKIE_SECURE: "true"
      COOKIE_EMBEDDED: "false"
      TRUST_PROXY: "true"
      PUBLIC_REGISTRATION_ENABLED: "${PUBLIC_REGISTRATION_ENABLED:-false}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SUREAUTO_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - frontend

volumes:
  sureauto-postgres:

networks:
  frontend:
    internal: true
  backend:
    internal: true
